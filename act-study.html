@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b24;--card:#1c2632;--ink:#eef0f3;--mute:#9aa6b5;--line:#33414f;--pencil:#f2b705;--ok:#59c48a;--bad:#ef8a80;--fill:#f2b705;--okbg:#1b3a2b;--badbg:#44211e}}
:root[data-theme="dark"]{--bg:#141b24;--card:#1c2632;--ink:#eef0f3;--mute:#9aa6b5;--line:#33414f;--pencil:#f2b705;--ok:#59c48a;--bad:#ef8a80;--fill:#f2b705;--okbg:#1b3a2b;--badbg:#44211e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Nunito Sans",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 30px/1.15 Bitter,Georgia,serif;margin:8px 0 4px}
p.sub{color:var(--mute);margin:0 0 18px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button,.btn{font:600 15px "Nunito Sans",sans-serif;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
nav button[aria-pressed="true"],.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mute);font-size:15px;margin-bottom:10px;flex-wrap:wrap}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:20px}
.passage{border-left:4px solid var(--pencil);padding:2px 0 2px 14px;margin:0 0 16px;color:var(--mute);font-size:16px}
.q{font:500 20px/1.4 Bitter,Georgia,serif;margin:0 0 16px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 14px "Nunito Sans";transition:background .15s,color .15s}
.opt.sel .bub{background:var(--fill);color:var(--bg)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1.5px dashed var(--line)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.flash{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer;font:500 21px/1.4 Bitter,Georgia,serif}
.flash small{display:block;font:600 14px "Nunito Sans";color:var(--mute);margin-top:10px}
.score{font:700 44px Bitter,serif;margin:6px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.plan li{margin-bottom:6px}
a.btn{text-decoration:none;display:inline-block}
</style>

function bank(s){
 const sp=t=>t.split('|'),pick=(r,n,from)=>shuf(from.filter(x=>x!==r)).slice(0,n);
 if(s==='Math')return DATA.Math.concat(genMath().map((q,i)=>({...q,t:['ACT math solving linear equations','ACT math percents','ACT math Pythagorean theorem','ACT math slope of a line','ACT math mean average','ACT math area of a circle','ACT math factoring quadratics'][i]})));
 if(s==='English')return DATA.English.concat(CATS.flatMap(([o,rule,items])=>items.map(t=>{const[q,a]=sp(t),op=o.split(',');return{q:`Choose the word that best fills the blank:<br>${q}`,o:op,a:op.indexOf(a),w:`Answer: ${a}. ${rule}`,t:`ACT English grammar ${op[0]} vs ${op[1]}`}})));
 if(s==='Reading'){
  const v=VOC.map(t=>{const[q,...o]=sp(t),w=q.match(/\*(.+?)\*/)[1];return{q:`What does the word '${w}' most nearly mean here?<br>${q.replace(/\*/g,'')}`,o,a:0,w:`In context, '${w}' means ${o[0]}.`,t:'ACT reading vocabulary in context strategies'}});
  const tn=TONE.map(t=>{const[q,a]=sp(t);return{q:`Which word best describes how the character feels?<br>${q}`,o:[a,...pick(a,3,TONES)],a:0,w:`The actions show the feeling: ${a}.`,t:'ACT reading author tone and attitude'}});
  const gs=GIST.map(t=>{const[p,g]=sp(t);return{p,q:'Which statement best gives the main idea?',o:[g,...pick(g,3,GIST.map(x=>sp(x)[1]))],a:0,w:`The passage is mainly about this: ${g}`,t:'ACT reading main idea questions'}});
  return DATA.Reading.concat(v,tn,gs);}
 const pool=EXP.flatMap(x=>sp(x).slice(1));
 const ex=EXP.flatMap(t=>{const[s2,i,d]=sp(t),mk=(r,m,k,w)=>({q:`${s2}. What is the ${k} variable?`,o:[r,...[...new Set([m,...shuf(pool)])].filter(x=>x!==r).slice(0,3)],a:0,w,t:'ACT science independent and dependent variables'});return[mk(i,d,'independent',`The independent variable is what the experimenter changes: ${i}.`),mk(d,i,'dependent',`The dependent variable is what gets measured: ${d}.`)]});
 const fc=FACTS.map(t=>{const[q,...o]=sp(t);return{q,o,a:0,w:`Answer: ${o[0]}.`,t:'ACT science review basics'}});
 return DATA.Science.concat(ex,fc,genSci().map((q,i)=>({...q,t:['ACT science data interpretation tables','ACT science inverse relationships Boyle law','ACT science exponential growth data','ACT science mean of trials','ACT science reading data tables'][i]})));
}
function genSci(){
 const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,out=[];
 const mk=(q,r,c,w)=>({q,o:[String(r),...[...new Set(c.map(String))].filter(x=>x!==String(r)).slice(0,3)],a:0,w});
 const s=R(10,30),r=R(2,6);
 out.push(mk(`A liquid is heated. At 0 min it is ${s}°C, at 2 min ${s+2*r}°C, and at 4 min ${s+4*r}°C. What is the temperature at 6 min?`,`${s+6*r}°C`,[`${s+5*r}°C`,`${s+8*r}°C`,`${s+7*r}°C`,`${s+3*r}°C`],`It rises ${r}°C each minute, so at 6 min it is ${s} + ${6*r} = ${s+6*r}°C.`));
 const k=R(2,6)*8;
 out.push(mk(`Gas pressure and volume: 1 atm = ${k} L, 2 atm = ${k/2} L, 4 atm = ${k/4} L. What is the volume at 8 atm?`,`${k/8} L`,[`${k/4} L`,`${k/16} L`,`${k/2} L`,`${k/8+2} L`],`Volume halves each time pressure doubles, so ${k/4} ÷ 2 = ${k/8} L.`));
 const P=R(2,9)*10;
 out.push(mk(`A colony has ${P} cells at hour 1 and doubles every hour. How many cells are there at hour 4?`,P*8,[P*4,P*16,P*6,P*12],`Hour 2: ${P*2}, hour 3: ${P*4}, hour 4: ${P*8}.`));
 const m=R(10,30),d=R(1,5);
 out.push(mk(`Three trials measured ${m-d}, ${m}, and ${m+d} cm. What is the mean?`,m,[m+d,m-d,m+1,m-1],`The sum is ${3*m}, and ${3*m} ÷ 3 = ${m}.`));
 const v=shuf([12,18,25,31,37,44,52,60]).slice(0,4),L='ABCD',mx=v.indexOf(Math.max(...v));
 out.push(mk(`Trial A = ${v[0]} cm, B = ${v[1]} cm, C = ${v[2]} cm, D = ${v[3]} cm. Which trial had the greatest value?`,`Trial ${L[mx]}`,[...L].filter((_,i)=>i!==mx).map(x=>`Trial ${x}`),`${v[mx]} is the largest number.`));
 return out;
}
function genMath(){
 const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,out=[];
 const mk=(q,r,c,w)=>{const wr=[...new Set(c.map(String))].filter(x=>x!==String(r)).slice(0,3);return{q,o:[String(r),...wr],a:0,w}};
 let x=R(2,9),a=R(2,6),b=R(1,15);
 out.push(mk(`If ${a}x + ${b} = ${a*x+b}, what is x?`,x,[x+1,x-1,x+2,a*x],`Subtract ${b}: ${a}x = ${a*x}. Divide by ${a}: x = ${x}.`));
 const p=[10,20,25,30,40,50][R(0,5)],n=R(2,20)*20,r=p*n/100;
 out.push(mk(`What is ${p}% of ${n}?`,r,[r+10,r*2,r+5,r+15,p],`${p}% = ${p/100}. ${p/100} × ${n} = ${r}.`));
 const T=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25]][R(0,4)];
 out.push(mk(`A right triangle has legs ${T[0]} and ${T[1]}. What is its hypotenuse?`,T[2],[T[0]+T[1],T[2]+1,T[2]-1,T[2]+2],`${T[0]}² + ${T[1]}² = ${T[0]**2+T[1]**2}, so the hypotenuse is ${T[2]}.`));
 const x1=R(0,4),y1=R(0,6),m=R(1,5),dx=R(1,4);
 out.push(mk(`What is the slope of the line through (${x1}, ${y1}) and (${x1+dx}, ${y1+m*dx})?`,m,[m+1,m+2,m*2,m+3,dx+m],`Slope = rise over run = ${m*dx}/${dx} = ${m}.`));
 const mm=R(6,20),d1=R(1,4),d2=R(5,8),nums=shuf([mm-d1,mm+d1,mm-d2,mm+d2,mm]);
 out.push(mk(`What is the mean of ${nums.join(", ")}?`,mm,[mm+1,mm-1,mm+2,mm-2],`Add them (${mm*5}) and divide by 5 to get ${mm}.`));
 const rad=R(3,9);
 out.push(mk(`A circle has radius ${rad}. What is its area?`,`${rad*rad}π`,[`${2*rad}π`,`${rad}π`,`${2*rad*rad}π`,`${rad*rad+rad}π`],`Area = πr² = π × ${rad}² = ${rad*rad}π.`));
 const p2=R(1,4),q2=R(p2+1,7);
 out.push(mk(`Solve x² − ${p2+q2}x + ${p2*q2} = 0.`,`x = ${p2} or ${q2}`,[`x = −${p2} or −${q2}`,`x = ${p2} or ${q2+1}`,`x = ${p2+1} or ${q2}`,`x = ${p2} or −${q2}`],`Factor: (x − ${p2})(x − ${q2}) = 0, so x = ${p2} or ${q2}.`));
 return out;
}
function newRun(s){
 let pool=bank(s);
 const qs=shuf(pool).slice(0,5).map(q=>{const c=q.o[q.a],o=shuf(q.o);return{...q,o,a:o.indexOf(c)}});
 st={s,i:0,pick:null,score:0,done:false,t0:Date.now(),qs};
}
function letters(i){return i%2===0?["A","B","C","D"]:["F","G","H","J"]}
function render(){
 if(tab==="Flashcards")return flash();
 if(tab==="Study plan")return plan();
 if(st.s!==tab)newRun(tab);
 const qs=st.qs;
 if(st.done){
  const sec=Math.round((Date.now()-st.t0)/1000);
  view.innerHTML=`<div class="card"><div>${tab} finished</div><div class="score">${st.score} / ${qs.length}</div><p>You took ${Math.floor(sec/60)}m ${sec%60}s. Review the explanations you missed, then try again.</p><div class="row"><button class="btn primary" id="again">New ${tab} set</button></div></div>`;
  $("#again").onclick=()=>{newRun(tab);render()};
  safe(()=>{const k="act_best_"+tab,b=+localStorage.getItem(k)||0;if(st.score>b)localStorage.setItem(k,st.score)});
  return;}
 const q=qs[st.i],L=letters(st.i);
 const best=safe(()=>localStorage.getItem("act_best_"+tab),null);
 view.innerHTML=`<div class="bar"><span>Question ${st.i+1} of ${qs.length}${best?` · best ${best}/${qs.length}`:""}</span><span class="timer" id="tm">0:00</span></div>
 <div class="card">${q.p?`<p class="passage">${q.p}</p>`:""}<p class="q">${q.q.replace(/\n/g,"<br>")}</p><div id="opts"></div><div id="fb"></div></div>`;
 const box=$("#opts");
 q.o.forEach((t,j)=>{const b=document.createElement("button");b.className="opt";b.innerHTML=`<span class="bub">${L[j]}</span><span>${t}</span>`;b.onclick=()=>answer(j);box.appendChild(b)});
 tick();
}
function tick(){clearInterval(window._t);window._t=setInterval(()=>{const e=$("#tm");if(!e){clearInterval(window._t);return}const s=Math.round((Date.now()-st.t0)/1000);e.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},500)}
function answer(j){
 if(st.pick!==null)return;st.pick=j;
 const q=st.qs[st.i],opts=[...document.querySelectorAll(".opt")];
 opts.forEach((o,k)=>{o.disabled=true;if(k===q.a)o.classList.add("right");else if(k===j)o.classList.add("wrong");if(k===j)o.classList.add("sel")});
 if(j===q.a)st.score++;
 const last=st.i===st.qs.length-1;
 $("#fb").innerHTML=`<div class="why"><strong>${j===q.a?"Correct.":"Not quite."}</strong> ${q.w}</div><div class="row"><button class="btn primary" id="nx">${last?"See score":"Next question"}</button>${j===q.a?"":`<a class="btn" target="_blank" rel="noopener" href="${VID[q.t]||'https://www.youtube.com/results?search_query='+encodeURIComponent(q.t||'ACT '+tab+' tips')}">Watch a video on this</a>`}</div>`;
 $("#nx").onclick=()=>{st.pick=null;if(last)st.done=true;else st.i++;render()};
}
let fi=0,flip=false;
function flash(){
 const c=CARDS[fi];
 view.innerHTML=`<div class="bar"><span>Card ${fi+1} of ${CARDS.length}</span></div>
 <div class="card flash" id="fc" role="button" tabindex="0" aria-label="Flip card"><div>${flip?c[1]:c[0]}<small>${flip?"Tap to see the topic":"Tap to see the answer"}</small></div></div>
 <div class="row"><button class="btn" id="pv">Previous</button><button class="btn primary" id="nx">Next card</button><button class="btn" id="sh">Shuffle</button></div>`;
 $("#fc").onclick=()=>{flip=!flip;flash()};
 $("#fc").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip=!flip;flash()}};
 $("#pv").onclick=()=>{fi=(fi-1+CARDS.length)%CARDS.length;flip=false;flash()};
 $("#nx").onclick=()=>{fi=(fi+1)%CARDS.length;flip=false;flash()};
 $("#sh").onclick=()=>{for(let i=CARDS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[CARDS[i],CARDS[j]]=[CARDS[j],CARDS[i]]}fi=0;flip=false;flash()};
}
function plan(){
 view.innerHTML=`<div class="card plan"><p class="q">A simple 4-week plan</p><ol>
 <li><strong>Week 1:</strong> Take a full practice test from act.org to find your weakest section.</li>
 <li><strong>Week 2:</strong> Drill your weakest section for 30 minutes a day. Review every wrong answer.</li>
 <li><strong>Week 3:</strong> Practice timed sections. English gives about 36 seconds per question, Math about 1 minute.</li>
 <li><strong>Week 4:</strong> Take another full timed test, then review mistakes and rest the night before.</li></ol>
 <p>Tip: keep a notebook of every question you miss and why. Patterns show up fast.</p></div>`;
}
drawTabs();render();
</script>
